services:
  - type: web
    name: piedrazul-tercer-corte
    runtime: docker
    plan: free
    branch: avance-Cardenas
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: mysql
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_AGENDADOR_PASSWORD
        sync: false
      - key: DEMO_PATIENT_PASSWORD
        sync: false
      - key: DEMO_MEDICO_PASSWORD
        sync: false
