spring:
  application:
    name: piedra-azul-citas
  datasource:
    url: jdbc:h2:mem:piedrazul;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: never

server:
  port: 8080

app:
  jwt:
    secret: "PiedraAzulRedMedicaClaveJwtSuperSegura2026UnicaucaSoftwareIII"
    expiration-ms: 86400000
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"

logging:
  level:
    com.piedrazul: INFO
